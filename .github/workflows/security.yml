# Security screening from the shared IronFlock CI harness: secrets, Go
# dependencies (govulncheck on the code AND the embedded frpc via `just sarif`),
# semgrep (IronFlock rules; gosec runs in `just lint`), Dockerfile
# configuration, licences and SBOMs (`just sbom`). The agent ships as a bare
# binary; its runtime image needs a prebuilt binary and is not scanned here.
# See docs/SECURITY-SCANNING.md.
#
# Blocking: the `report` job fails on secrets, fixable high/critical
# vulnerabilities, high misconfigurations, forbidden licences and semgrep
# errors. Accepted findings live in security/vex.openvex.json,
# .trivyignore.yaml and .gitleaks.toml, each with its reason.
name: security

on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:17 UTC: catch CVEs newly disclosed against unchanged code.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: IronFlock/workflows/.github/workflows/security.yml@v1
    permissions:
      contents: read
      security-events: write
    with:
      working-directory: src
      languages: go
      semgrep-rulesets: ""
      sarif-recipe: sarif
      sbom-recipe: sbom
      fail-on: secrets,vuln-critical,vuln-high,misconfig-high,license-forbidden,semgrep-error
      code-scanning: false
