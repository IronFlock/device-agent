# Build + publish the device agent (binaries to GCS, multi-arch images to
# Artifact Registry) and record a signed SBOM attestation per binary.
#
# The binaries are staged WITHOUT the Ed25519 signature (.sig) agents require
# before installing an update or frpc. GitHub holds no signing material: the
# key is non-exportable in Cloud KMS, and only the `promote` job of a tag run
# of this workflow may sign with it (scripts/sign-release.sh).
#
# On the merge of a release pull request it stages the version (binaries at
# gs://ironflock-downloads/device-agent/<os>/<arch>/<version>/, images pushed)
# and then PROMOTES it (`promote` job, `just promote-ci`): every binary, the
# pinned frpc and manifest-v2.json are signed with the Cloud KMS key
# ironflock-release/agent-update, then the version files flip and agents
# update. The bridge release (src/release/bridge-version.txt) is the exception:
# it is promoted by hand through OpenBao (`just promote-bridge`). See README
# "Build, Publish and Release".
#
# Trigger: the merge of a release pull request (`just release-patch`: version
# bump, title `release reagent v<version>`) into main. Checks are not repeated
# here: main is protected (pull requests whose ci-ok and security / report
# checks passed), and `verify` (the harness's release.sh mode) only releases
# the squash merge of a release pull request whose title names the version in
# src/release/version.txt. The tag v<version> comes last, set by the release
# GitHub App once everything is published and promoted, so a tag always means
# "released". ci.yml calls this workflow on release pull requests
# (workflow_call), and a manual run (workflow_dispatch) only builds: neither
# logs in to Google Cloud, publishes or promotes. Only a release run on main
# may act as the release identities (workload identity attribute release).
# A no-release merge starts nothing: `paths` holds only the version file, and
# when a no-release pull request touches it anyway the jobs are skipped by its
# merge title. Auth: Workload Identity Federation (keyless) — see README
# one-time setup.
name: release

on:
  push:
    branches: [main]
    paths: [src/release/version.txt]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # WIF (GCP) + sigstore attestation signing
  attestations: write # store the SBOM attestations

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    # A no-release merge that touches the version file anyway: no runner.
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'release ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.json }}
      # release: publish and promote; released: a re-run after the tag
      # (nothing left to do); dry-run: build only.
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: v1
          path: .harness
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
      - name: what this run releases
        id: mode
        env:
          VERSION_FILE: src/release/version.txt
          TAG_PREFIX: v
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_BRANCH: main
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          "$RUNNER_TEMP/harness/scripts/release.sh" mode
      # Single source of truth for the build matrix: the repo's `targets` file.
      - id: targets
        run: echo "json=$(jq -R -s -c 'split("\n") | map(select(length > 0))' targets)" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.verify.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No module cache in a release: a cache written by another workflow
      # must not feed a published binary.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"

      - name: Build (${{ matrix.target }})
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/build.sh src build "$TARGET"

      - name: Resolve binary name
        id: bin
        env:
          TARGET: ${{ matrix.target }}
        run: |
          IFS=/ read -r os arch variant <<< "$TARGET"
          name="device-agent-${os}-${arch}"
          [ -n "${variant:-}" ] && name="device-agent-${os}-${arch}v${variant}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        env:
          BIN: ${{ steps.bin.outputs.name }}
        run: just sbom-bin "build/$BIN"

      - name: Attest SBOM (sigstore-signed, bound to the binary digest)
        # Only a release run publishes; a pull request or manual run is a dry run.
        if: needs.verify.outputs.mode == 'release'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/${{ steps.bin.outputs.name }}
          sbom-path: build/${{ steps.bin.outputs.name }}.cdx.json

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ steps.bin.outputs.name }}
          path: build/${{ steps.bin.outputs.name }}
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ steps.bin.outputs.name }}
          path: build/${{ steps.bin.outputs.name }}.cdx.json
          if-no-files-found: error

  publish:
    name: publish to GCS + push images
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"

      # Collect every built binary back into build/ (bin-* only — not the SBOMs,
      # so scripts/publish.sh sees only device-agent-* binaries).
      - name: Collect built binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: build
          pattern: bin-*
          merge-multiple: true

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: needs.verify.outputs.mode == 'release'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: false

      # frpc is delivered to Windows devices as a separate, out-of-process
      # binary (never embedded into device-agent.exe, whose bytes would then
      # trip antivirus). Built from source by the frp/ module so we control the
      # supply chain and can sign it. It publishes to device-agent/frpc/, which
      # the appliance /dl/device-agent proxy route covers.
      - name: Build frpc for Windows from source
        run: scripts/build-frpc.sh windows amd64 build/frpc-windows-amd64

      # Authenticode-sign the Windows binaries with the leaf cert (osslsigncode
      # runs on Linux) + a free RFC3161 timestamp, BEFORE publishing. The
      # service executes self-downloaded updates as SYSTEM, and the agent pins
      # the signature to our root on-device. No-ops until the signing secret is
      # configured, so the pipeline works during the pre-signing transition.
      - name: Authenticode-sign Windows binaries
        env:
          WINDOWS_SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_B64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: scripts/sign-windows.sh build/device-agent-windows-amd64 build/frpc-windows-amd64

      - name: Publish agent binaries to gs://ironflock-downloads/device-agent
        # Only a release run publishes; a pull request or manual run is a dry run.
        if: needs.verify.outputs.mode == 'release'
        run: scripts/publish.sh

      - name: Publish frpc to gs://ironflock-downloads/device-agent/frpc
        if: needs.verify.outputs.mode == 'release'
        run: scripts/publish-frpc.sh windows amd64 build/frpc-windows-amd64

      - name: Configure Docker auth for Artifact Registry
        if: needs.verify.outputs.mode == 'release'
        run: gcloud auth configure-docker europe-docker.pkg.dev --quiet
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build + push multi-arch agent images
        if: needs.verify.outputs.mode == 'release'
        run: just push-docker-image

  promote:
    name: sign (Cloud KMS) + promote
    needs: [verify, publish]
    # Only the release run of a merged release pull request gets here. Never a
    # pull request or a manual run: that would re-promote an old version.
    if: needs.verify.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The bridge release is promoted by hand (OpenBao). Every later release
      # needs the bridge live first, and never goes below the live version:
      # re-running an old tag's release must not roll the fleet back.
      - name: Bridge release, order, no rollback
        id: bridge
        run: |
          version=$(tr -d '[:space:]' < src/release/version.txt)
          bridge=$(tr -d '[:space:]' < src/release/bridge-version.txt)
          if [ "$version" = "$bridge" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$version is the bridge release: staged, NOT promoted. Promote it by hand with: just promote-bridge"
            exit 0
          fi
          live=$(curl -fsS --retry 3 https://storage.googleapis.com/ironflock-downloads/device-agent/version.txt | tr -d '[:space:]')
          at_least() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }
          if ! at_least "$live" "$bridge"; then
            echo "::error::the bridge release $bridge is not live yet (live: $live). Promote it first: just promote-bridge"; exit 1
          fi
          if ! at_least "$version" "$live"; then
            echo "::error::$version is older than the live $live: not promoted (roll back by hand: just promote)"; exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.bridge.outputs.skip == 'false'
        with:
          go-version-file: src/go.mod
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        if: steps.bridge.outputs.skip == 'false'
        with:
          just-version: "1.59.0"

      # Signing identity: may only sign with the KMS key, and only from a
      # release run of this workflow on main (workload identity attribute
      # release).
      - name: Authenticate the signer (Cloud KMS only)
        id: signer
        if: steps.bridge.outputs.skip == 'false'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: agent-signer@record-1283.iam.gserviceaccount.com
      - name: Keep the signer credentials for the KMS calls only
        if: steps.bridge.outputs.skip == 'false'
        env:
          SIGNER_CREDENTIALS: ${{ steps.signer.outputs.credentials_file_path }}
        run: echo "KMS_CREDENTIALS=$SIGNER_CREDENTIALS" >> "$GITHUB_ENV"
      # Publishing identity (the bucket), as in `publish`; default credentials.
      - name: Authenticate the publisher
        if: steps.bridge.outputs.skip == 'false'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.bridge.outputs.skip == 'false'

      - name: Sign with Cloud KMS and promote
        if: steps.bridge.outputs.skip == 'false'
        run: just promote-ci

  # The tag once the version is published and promoted (the bridge release is
  # staged only, and tagged too); only on the merge of a release pull request.
  # Written with the release GitHub App's token from the `release` environment
  # (deployments from main only).
  tag:
    needs: [verify, publish, promote]
    if: >-
      !cancelled() && needs.verify.outputs.mode == 'release' && needs.publish.result == 'success' &&
      needs.promote.result == 'success'
    uses: IronFlock/workflows/.github/workflows/release-tag.yml@v1
    permissions:
      contents: read
    # The App key is a secret of the `release` environment; environment
    # secrets reach a reusable workflow only through `secrets: inherit`.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      version-file: src/release/version.txt
