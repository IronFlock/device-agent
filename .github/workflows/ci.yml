# Gate (lint for Linux and Windows, unit tests under race + shuffle, cross-builds
# of the agent with frpc built from source) from the shared IronFlock CI harness,
# workflow lint, plus this repository's integration suite, coverage and native
# Windows tests. `ci-ok` is the required check of the main-branch ruleset.
#
# Integration and coverage drive Docker and are environment-sensitive; they run
# WITHOUT -race and self-skip when their resource (docker/dbus/frps) is absent.
#
# Pull requests into main only: the ruleset lets nothing reach main without
# ci-ok. The release intent decides whether the merge releases; release pull
# requests also run release.yml as a dry run (every target, no publish).
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: IronFlock/workflows/.github/workflows/go-gate.yml@v1
    with:
      working-directory: src
      setup-recipe: build-frpc
      # Supported edge platforms (macOS is a development platform only).
      targets: |
        linux/amd64
        linux/arm64
        linux/arm/7
        linux/arm/6
        windows/amd64
      cross-build-command: scripts/build.sh src build "$TARGET"

  workflows:
    uses: IronFlock/workflows/.github/workflows/workflows-lint.yml@v1

  # The version decides: a bump makes a release PR (`just release-patch`,
  # title `release reagent v<version>`), an unchanged version a no-release PR
  # (`just merge`) whose merge releases nothing.
  intent:
    uses: IronFlock/workflows/.github/workflows/release-intent.yml@v1
    with:
      version-file: src/release/version.txt

  # Release pull requests only: release.yml as a dry run (every target built,
  # nothing published, signed or promoted), so a broken release build never
  # reaches main.
  release-build:
    needs: [intent]
    if: needs.intent.outputs.kind == 'release'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    # No secrets: a dry run neither signs (Authenticode) nor publishes.

  integration:
    runs-on: ubuntu-latest # GitHub-hosted ubuntu has Docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: |
            src/go.sum
            frp/go.sum
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - run: just build-frpc
      - name: integration suite (no race; self-skips frps/dbus)
        run: cd src && go test -tags integration -count=1 ./...

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: |
            src/go.sum
            frp/go.sum
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - run: just test-coverage-prod
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: src/coverage.out
          if-no-files-found: warn

  # Native Windows check for the Windows-service code paths (svc handler,
  # installer CLI, self-update swap, ConPTY host terminal, the layout
  # migration and its service control manager contract): the packages that
  # carry windows build tags plus a full native build.
  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: native build (all packages, windows tags active)
        run: cd src && touch embedded/frpc_binary && go build ./...
      - name: unit tests (service, self-update, codesign, tunnel, lifecycle, config, system, terminal, layout, apps, migration)
        run: cd src && go test -count=1 ./selfupdate/... ./codesign/... ./tunnel/... ./lifecycle/... ./config/... ./system/... ./terminal/... ./layout/... ./apps/... ./migrate/winmigrate/... ./migratestate/... ./winservice/... .
      # The behaviour table the migration's fake service control manager
      # models, against the real one: throwaway services made from the test
      # binary (the runner is elevated; the test skips when it is not), and
      # the real repair scripts over fixture folders.
      - name: service control manager contract
        run: cd src && go test -count=1 -v -run 'TestContract' ./migrate/winmigrate/...

  # The required check of the main-branch ruleset: green only when every job
  # above succeeded (skipped or cancelled counts as failed).
  ci-ok:
    if: ${{ always() }}
    needs: [gate, workflows, intent, integration, coverage, windows-unit, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: all ci jobs succeeded
        env:
          REQUIRED: >-
            ${{ needs.gate.result }} ${{ needs.workflows.result }} ${{ needs.intent.result }}
            ${{ needs.integration.result }} ${{ needs.coverage.result }} ${{ needs.windows-unit.result }}
          RELEASE_BUILD: ${{ needs.release-build.result }}
          KIND: ${{ needs.intent.outputs.kind }}
        run: |
          echo "required: $REQUIRED, release-build: $RELEASE_BUILD ($KIND)"
          for r in $REQUIRED; do [ "$r" = success ] || exit 1; done
          if [ "$KIND" = release ]; then [ "$RELEASE_BUILD" = success ]; else [ "$RELEASE_BUILD" = skipped ]; fi
