# golangci-lint v2 configuration (run by `just lint`).
version: "2"

run:
  # Lint the integration suites too: they build only with this tag.
  build-tags:
    - integration

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - gosec
  settings:
    staticcheck:
      checks:
        - all
        # golangci-lint's default exclusions (comment style, naming).
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Quick-fix and simplification suggestions that only restyle working
        # concurrency and state-machine code (if-chain -> switch, De Morgan,
        # single-case select); not worth the churn in the agent.
        - -QF1001
        - -QF1002
        - -QF1003
        - -S1000
    gosec:
      excludes:
        # Integer-conversion overflow: flags every bounded int conversion
        # (ports, sizes, ids); the values are bounded where they enter.
        - G115
        # File path from a variable: the agent's paths come from its own
        # configuration and layout, not from remote input. Remote-supplied
        # names are checked where they enter (e.g. archive extraction).
        - G304
        # Directory mode 0755: log, unit, app and download directories hold
        # no secrets. File modes (G302/G306) stay checked per site.
        - G301
  exclusions:
    paths:
      # Generated D-Bus bindings for NetworkManager.
      - networkmanager/
    rules:
      # Test doubles ignore write/close errors and use fixed paths and
      # permissions on purpose.
      - path: _test\.go
        linters: [errcheck, gosec]
      - path: /testutil/
        linters: [errcheck, gosec]

formatters:
  enable:
    - gofmt
